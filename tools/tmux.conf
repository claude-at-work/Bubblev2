# tmux.conf — mobile-friendly configuration
# Install: cp tools/tmux.conf ~/.tmux.conf  (then: tmux source ~/.tmux.conf)
#
# Key philosophy:
#   - Prefix is Ctrl+a (easier than Ctrl+b on phone keyboards)
#   - Alt+number jumps windows directly — no prefix
#   - Alt+arrow moves between panes — no prefix
#   - Mouse on: tap to focus pane, scroll to scroll, drag to resize


# ── Prefix ───────────────────────────────────────────────────────────────

set -g prefix C-a
unbind C-b
bind C-a send-prefix          # Ctrl+a Ctrl+a → send literal Ctrl+a to shell


# ── General ──────────────────────────────────────────────────────────────

set -g escape-time 0          # eliminate ESC delay (essential for vim/nvim)
set -g history-limit 20000
set -g base-index 1           # windows at 1–9 instead of 0–8 (reachable on phone)
setw -g pane-base-index 1
set -g renumber-windows on    # fill gaps when windows are closed
set -g mouse on               # tap pane to focus; two-finger scroll; drag border to resize
set -g focus-events on
set -g display-time 2000      # status messages stay visible 2 s


# ── Look ─────────────────────────────────────────────────────────────────

set -g default-terminal "screen-256color"
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Status bar
set -g status-style                 "bg=colour235,fg=colour250"
set -g status-left                  " #[bold,fg=colour39]#S#[nobold,fg=colour250] "
set -g status-left-length           24
set -g status-right                 " #[fg=colour244]%H:%M "
set -g status-right-length          10

# Windows in status bar
setw -g window-status-format        " #I:#W "
setw -g window-status-current-format  "#[bold,fg=colour39,bg=colour238] #I:#W #[default]"
setw -g window-status-separator     ""

# Pane borders
set -g pane-border-style            "fg=colour238"
set -g pane-active-border-style     "fg=colour39"

# Command / message line
set -g message-style                "bg=colour238,fg=colour39"


# ── Session / window creation ─────────────────────────────────────────────

# New window keeps the current path
bind c new-window      -c "#{pane_current_path}"

# Splits that also keep current path; | and - are intuitive
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


# ── Pane navigation ───────────────────────────────────────────────────────

# With prefix: vim hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Without prefix: Alt+arrow — the fastest option on a phone
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Swap panes
bind < swap-pane -U
bind > swap-pane -D

# Kill pane / window without confirmation prompt
bind x kill-pane
bind X kill-window


# ── Window navigation ─────────────────────────────────────────────────────

# Alt+1–9 jumps directly to a window — no prefix, one tap on mobile
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Previous / next window
bind -n M-, previous-window
bind -n M-. next-window


# ── Session navigation ────────────────────────────────────────────────────

# Visual session+window tree picker (built-in, very usable with mouse)
bind s choose-tree -Zs


# ── Copy mode ─────────────────────────────────────────────────────────────

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ── Misc ──────────────────────────────────────────────────────────────────

# Reload config in-place
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Clear pane scrollback
bind K clear-history \; display "Scrollback cleared"

# Toggle status bar (reclaim one line of screen space)
bind b set -g status
